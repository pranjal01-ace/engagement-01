<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <radialGradient id="coupleBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1B1438"/>
      <stop offset="60%" stop-color="#0E0A22"/>
      <stop offset="100%" stop-color="#050310"/>
    </radialGradient>
    <linearGradient id="goldCouple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="40%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8E6A1B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#coupleBg)"/>
  
  <!-- Royal Borders -->
  <rect x="25" y="25" width="550" height="750" rx="12" stroke="url(#goldCouple)" stroke-width="2" fill="none"/>
  <rect x="35" y="35" width="530" height="730" rx="8" stroke="url(#goldCouple)" stroke-width="1" stroke-dasharray="4,4" fill="none"/>
  
  <!-- Sacred Royal Mandala -->
  <circle cx="300" cy="320" r="190" stroke="url(#goldCouple)" stroke-width="1" stroke-opacity="0.25" fill="none"/>
  <circle cx="300" cy="320" r="150" stroke="url(#goldCouple)" stroke-width="1" stroke-dasharray="3,5" stroke-opacity="0.3" fill="none"/>

  <!-- Interlocking Engagement Rings with Solitaire Diamond -->
  <g transform="translate(300, 310)" stroke="url(#goldCouple)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Ring (Groom) -->
    <ellipse cx="-45" cy="0" rx="65" ry="40" stroke-width="5" fill="none" transform="rotate(-15 -45 0)"/>
    <ellipse cx="-45" cy="0" rx="55" ry="32" stroke-width="2" fill="none" stroke-dasharray="3,3" transform="rotate(-15 -45 0)"/>

    <!-- Right Ring (Bride) -->
    <ellipse cx="45" cy="0" rx="65" ry="40" stroke-width="5" fill="none" transform="rotate(15 45 0)"/>
    <ellipse cx="45" cy="0" rx="55" ry="32" stroke-width="2" fill="none" stroke-dasharray="3,3" transform="rotate(15 45 0)"/>

    <!-- Solitaire Diamond on Bride's Ring -->
    <polygon points="50,-42 65,-60 80,-42 65,-25" fill="#FFF8D6" stroke="#AA7A1E" stroke-width="2"/>
    <line x1="50" y1="-42" x2="80" y2="-42" stroke="#AA7A1E" stroke-width="1"/>
    <!-- Diamond Sparkle Rays -->
    <line x1="65" y1="-75" x2="65" y2="-65" stroke="#FFF3B0" stroke-width="2"/>
    <line x1="85" y1="-60" x2="75" y2="-60" stroke="#FFF3B0" stroke-width="2"/>
    <line x1="45" y1="-60" x2="55" y2="-60" stroke="#FFF3B0" stroke-width="2"/>

    <!-- Floral Garland / Varmala Petals -->
    <circle cx="-110" cy="15" r="5" fill="#E5C158" stroke="none"/>
    <circle cx="110" cy="15" r="5" fill="#E5C158" stroke="none"/>
    <circle cx="0" cy="50" r="6" fill="#FFF3B0" stroke="none"/>
  </g>

  <!-- Typography -->
  <text x="300" y="520" font-family="'Cinzel Decorative', serif" font-size="34" font-weight="bold" fill="url(#goldCouple)" text-anchor="middle">AMAN &amp; ANSHIKA</text>
  <text x="300" y="560" font-family="'Cinzel', serif" font-size="14" letter-spacing="4" fill="#E5C158" text-anchor="middle">TWO SOULS • ONE JOURNEY</text>
  
  <line x1="180" y1="590" x2="420" y2="590" stroke="url(#goldCouple)" stroke-width="1"/>
  <circle cx="300" cy="590" r="3" fill="#FFF3B0"/>

  <text x="300" y="640" font-family="'Montserrat', sans-serif" font-size="12" letter-spacing="2" fill="#EFE6D4" text-anchor="middle" opacity="0.85">Awaiting Couple Photograph</text>
  <text x="300" y="665" font-family="'Montserrat', sans-serif" font-size="11" fill="#D4AF37" text-anchor="middle" opacity="0.7">assets/images/couple/couple-1.jpg</text>
</svg>

