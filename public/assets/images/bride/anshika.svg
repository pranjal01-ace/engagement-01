<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <radialGradient id="brideBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4A0E17"/>
      <stop offset="60%" stop-color="#240509"/>
      <stop offset="100%" stop-color="#0B0204"/>
    </radialGradient>
    <linearGradient id="goldStrokeBride" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8E6A1B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#brideBg)"/>
  
  <!-- Royal Borders -->
  <rect x="25" y="25" width="550" height="750" rx="12" stroke="url(#goldStrokeBride)" stroke-width="2" fill="none"/>
  <rect x="35" y="35" width="530" height="730" rx="8" stroke="url(#goldStrokeBride)" stroke-width="1" stroke-dasharray="4,4" fill="none"/>
  
  <!-- Subtle Mandala Background Motif -->
  <circle cx="300" cy="340" r="180" stroke="url(#goldStrokeBride)" stroke-width="1" stroke-opacity="0.2" fill="none"/>
  <circle cx="300" cy="340" r="140" stroke="url(#goldStrokeBride)" stroke-width="1" stroke-dasharray="3,6" stroke-opacity="0.25" fill="none"/>

  <!-- Bride Royal Dupatta / Maang Tikka Silhouette -->
  <g transform="translate(300, 310)" stroke="url(#goldStrokeBride)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Royal Odhni / Chunari Veil Arch -->
    <path d="M-80 150 C-75 -20 -40 -100 0 -105 C40 -100 75 -20 80 150" stroke-width="3" fill="#D4AF37" fill-opacity="0.15"/>
    <path d="M-70 150 C-65 -10 -35 -85 0 -90 C35 -85 65 -10 70 150" stroke-width="1" stroke-dasharray="3,4"/>

    <!-- Maang Tikka & Matha Patti -->
    <path d="M 0 -85 L 0 -25" stroke-width="2.5"/>
    <circle cx="0" cy="-20" r="7" fill="#FFF3B0" stroke="#8E6A1B"/>
    <circle cx="0" cy="-20" r="3" fill="#E53935"/>
    <path d="M-40 -40 Q0 -30 40 -40" stroke-width="2" fill="none"/>

    <!-- Delicate Face & Jhumkas -->
    <path d="M-28 -15 C-35 25 -25 50 0 58 C25 50 35 25 28 -15"/>
    <!-- Traditional Jhumka Earrings -->
    <path d="M-36 10 L-36 22 M-42 22 L-30 22 M-36 28 L-36 22" stroke-width="2"/>
    <circle cx="-36" cy="30" r="3" fill="#FFF3B0"/>
    <path d="M 36 10 L 36 22 M 30 22 L 42 22 M 36 28 L 36 22" stroke-width="2"/>
    <circle cx="36" cy="30" r="3" fill="#FFF3B0"/>

    <!-- Royal Bridal Choker & Kundan Necklace -->
    <path d="M-26 65 Q0 85 26 65" stroke-width="3.5"/>
    <path d="M-35 85 Q0 115 35 85" stroke-width="2.5"/>
    <circle cx="0" cy="115" r="4.5" fill="#FFF3B0"/>

    <!-- Nath (Bridal Nose Ring) Accent -->
    <circle cx="10" cy="20" r="5" stroke-width="1.5" fill="none"/>
    <path d="M 15 20 Q 25 15 34 10" stroke-width="1"/>
  </g>

  <!-- Typography -->
  <text x="300" y="550" font-family="'Cinzel Decorative', serif" font-size="34" font-weight="bold" fill="url(#goldStrokeBride)" text-anchor="middle">ANSHIKA</text>
  <text x="300" y="585" font-family="'Cinzel', serif" font-size="14" letter-spacing="4" fill="#E5C158" text-anchor="middle">THE BRIDE</text>
  
  <line x1="200" y1="615" x2="400" y2="615" stroke="url(#goldStrokeBride)" stroke-width="1"/>
  <circle cx="300" cy="615" r="3" fill="#FFF3B0"/>

  <text x="300" y="655" font-family="'Montserrat', sans-serif" font-size="12" letter-spacing="2" fill="#EFE6D4" text-anchor="middle" opacity="0.85">Awaiting Photograph Upload</text>
  <text x="300" y="680" font-family="'Montserrat', sans-serif" font-size="11" fill="#D4AF37" text-anchor="middle" opacity="0.7">assets/images/bride/anshika.jpg</text>
</svg>

