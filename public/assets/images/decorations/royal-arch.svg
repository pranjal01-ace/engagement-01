<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="archGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8E6A1B"/>
    </linearGradient>
  </defs>

  <!-- Outer Architectural Framing -->
  <rect x="20" y="20" width="560" height="760" rx="8" stroke="url(#archGold)" stroke-width="2.5" fill="none"/>
  <rect x="32" y="32" width="536" height="736" rx="4" stroke="url(#archGold)" stroke-width="1" stroke-dasharray="4,4" fill="none"/>

  <!-- Ornate Scalloped Royal Archway (Jharokha Cusped Arch) -->
  <path d="M 60 760 L 60 320 
           C 60 220 120 180 180 180 
           C 200 150 220 130 250 110 
           C 280 90 300 70 300 50 
           C 300 70 320 90 350 110 
           C 380 130 400 150 420 180 
           C 480 180 540 220 540 320 
           L 540 760" 
        stroke="url(#archGold)" stroke-width="3" fill="none"/>

  <!-- Inner Delicate Arch Bead Line -->
  <path d="M 80 760 L 80 340 
           C 80 250 135 210 190 210 
           C 210 185 230 160 255 145 
           C 280 130 300 110 300 95 
           C 300 110 320 130 345 145 
           C 370 160 390 185 410 210 
           C 465 210 520 250 520 340 
           L 520 760" 
        stroke="url(#archGold)" stroke-width="1.2" stroke-dasharray="3,4" fill="none"/>

  <!-- Arch Apex Kalash / Finial -->
  <circle cx="300" cy="40" r="5" fill="#FFF3B0" stroke="#8E6A1B" stroke-width="1.5"/>
  <circle cx="300" cy="26" r="2.5" fill="#FFF3B0"/>
  
  <!-- Left Pillar Base & Capital -->
  <rect x="48" y="730" width="24" height="30" fill="url(#archGold)" fill-opacity="0.2" stroke="url(#archGold)" stroke-width="1.5"/>
  <rect x="48" y="320" width="24" height="15" fill="url(#archGold)" fill-opacity="0.3" stroke="url(#archGold)" stroke-width="1.5"/>
  
  <!-- Right Pillar Base & Capital -->
  <rect x="528" y="730" width="24" height="30" fill="url(#archGold)" fill-opacity="0.2" stroke="url(#archGold)" stroke-width="1.5"/>
  <rect x="528" y="320" width="24" height="15" fill="url(#archGold)" fill-opacity="0.3" stroke="url(#archGold)" stroke-width="1.5"/>
</svg>

