<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="sealRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#801825"/>
      <stop offset="50%" stop-color="#4A0E17"/>
      <stop offset="100%" stop-color="#230408"/>
    </radialGradient>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="40%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8F6A14"/>
    </linearGradient>
    <filter id="sealShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Wax Seal Outer scalloped body with shadow -->
  <circle cx="100" cy="100" r="92" fill="url(#sealRed)" filter="url(#sealShadow)"/>
  
  <!-- Outer Beaded Golden Rim -->
  <circle cx="100" cy="100" r="84" stroke="url(#sealGold)" stroke-width="2" fill="none"/>
  <circle cx="100" cy="100" r="78" stroke="url(#sealGold)" stroke-width="1" stroke-dasharray="2,3" fill="none"/>

  <!-- Royal Crest Crown on Top -->
  <g transform="translate(100, 48) scale(0.65)" stroke="url(#sealGold)" fill="url(#sealGold)" stroke-width="1.5">
    <path d="M-30 0 L-20 -20 L-10 -8 L0 -24 L10 -8 L20 -20 L30 0 Z"/>
    <circle cx="0" cy="-26" r="2.5" fill="#FFF8D6"/>
    <circle cx="-20" cy="-22" r="2" fill="#FFF8D6"/>
    <circle cx="20" cy="-22" r="2" fill="#FFF8D6"/>
  </g>

  <!-- Monogram Initials "A & A" -->
  <text x="72" y="118" font-family="'Cinzel Decorative', serif" font-size="38" font-weight="bold" fill="url(#sealGold)" text-anchor="middle">A</text>
  <text x="100" y="112" font-family="'Great Vibes', cursive" font-size="28" fill="#FFF8D6" text-anchor="middle">&amp;</text>
  <text x="128" y="118" font-family="'Cinzel Decorative', serif" font-size="38" font-weight="bold" fill="url(#sealGold)" text-anchor="middle">A</text>

  <!-- Engagement Text on Curve / Bottom -->
  <text x="100" y="148" font-family="'Cinzel', serif" font-size="10" letter-spacing="3" fill="#E5C158" text-anchor="middle">22 • 11 • 2026</text>
  <circle cx="100" cy="160" r="2.5" fill="#FFF8D6"/>
</svg>

