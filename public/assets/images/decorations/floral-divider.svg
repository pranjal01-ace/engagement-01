<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 50" fill="none">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="25%" stop-color="#D4AF37" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFF3B0" stop-opacity="1"/>
      <stop offset="75%" stop-color="#D4AF37" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Main Horizontal Line -->
  <line x1="20" y1="25" x2="480" y2="25" stroke="url(#divGold)" stroke-width="1.5"/>
  <line x1="60" y1="28" x2="440" y2="28" stroke="url(#divGold)" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Center Floral / Paisley Motif -->
  <g transform="translate(250, 25)" stroke="#E5C158" fill="none" stroke-width="1.5">
    <!-- Center Jewel -->
    <circle cx="0" cy="0" r="4.5" fill="#FFF3B0" stroke="#AA7A1E"/>
    <circle cx="0" cy="0" r="8" stroke="#D4AF37" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Left Leaf / Petal -->
    <path d="M-8 0 C-18 -12 -32 -6 -38 0 C-32 6 -18 12 -8 0 Z" fill="#D4AF37" fill-opacity="0.3" stroke="#E5C158"/>
    <circle cx="-42" cy="0" r="2.5" fill="#FFF3B0"/>
    <circle cx="-52" cy="0" r="1.5" fill="#E5C158"/>

    <!-- Right Leaf / Petal -->
    <path d="M8 0 C18 -12 32 -6 38 0 C32 6 18 12 8 0 Z" fill="#D4AF37" fill-opacity="0.3" stroke="#E5C158"/>
    <circle cx="42" cy="0" r="2.5" fill="#FFF3B0"/>
    <circle cx="52" cy="0" r="1.5" fill="#E5C158"/>

    <!-- Top & Bottom Accents -->
    <circle cx="0" cy="-12" r="1.8" fill="#FFF3B0"/>
    <circle cx="0" cy="12" r="1.8" fill="#FFF3B0"/>
  </g>
</svg>

