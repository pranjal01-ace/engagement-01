<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="mandalaGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5C0" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#E5C158" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#D4AF37" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#916E16" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(300, 300)" stroke="url(#mandalaGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Bindu -->
    <circle cx="0" cy="0" r="8" fill="#FFF5C0"/>
    <circle cx="0" cy="0" r="18" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="0" r="28" stroke-width="1" stroke-dasharray="2,3" fill="none"/>

    <!-- 8 Inner Petals -->
    <g stroke-width="1.8">
      <!-- 0 deg -->
      <path d="M0 -28 C10 -38 10 -55 0 -65 C-10 -55 -10 -38 0 -28 Z" fill="#D4AF37" fill-opacity="0.15"/>
      <!-- 45 deg -->
      <path d="M0 -28 C10 -38 10 -55 0 -65 C-10 -55 -10 -38 0 -28 Z" transform="rotate(45)" fill="#D4AF37" fill-opacity="0.15"/>
      <!-- 90 deg -->
      <path d="M0 -28 C10 -38 10 -55 0 -65 C-10 -55 -10 -38 0 -28 Z" transform="rotate(90)" fill="#D4AF37" fill-opacity="0.15"/>
      <!-- 135 deg -->
      <path d="M0 -28 C10 -38 10 -55 0 -65 C-10 -55 -10 -38 0 -28 Z" transform="rotate(135)" fill="#D4AF37" fill-opacity="0.15"/>
      <!-- 180 deg -->
      <path d="M0 -28 C10 -38 10 -55 0 -65 C-10 -55 -10 -38 0 -28 Z" transform="rotate(180)" fill="#D4AF37" fill-opacity="0.15"/>
      <!-- 225 deg -->
      <path d="M0 -28 C10 -38 10 -55 0 -65 C-10 -55 -10 -38 0 -28 Z" transform="rotate(225)" fill="#D4AF37" fill-opacity="0.15"/>
      <!-- 270 deg -->
      <path d="M0 -28 C10 -38 10 -55 0 -65 C-10 -55 -10 -38 0 -28 Z" transform="rotate(270)" fill="#D4AF37" fill-opacity="0.15"/>
      <!-- 315 deg -->
      <path d="M0 -28 C10 -38 10 -55 0 -65 C-10 -55 -10 -38 0 -28 Z" transform="rotate(315)" fill="#D4AF37" fill-opacity="0.15"/>
    </g>

    <!-- Mid Ring 1 -->
    <circle cx="0" cy="0" r="75" stroke-width="2"/>
    <circle cx="0" cy="0" r="85" stroke-width="1" stroke-dasharray="3,4"/>

    <!-- 16 Mid Lotus Petals -->
    <g stroke-width="1.5">
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(22.5)" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(45)" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(67.5)" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(90)" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(112.5)" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(135)" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(157.5)" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(180)" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(202.5)" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(225)" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(247.5)" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(270)" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(292.5)" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(315)" fill="#D4AF37" fill-opacity="0.1"/>
      <path d="M0 -85 C14 -105 14 -130 0 -145 C-14 -130 -14 -105 0 -85 Z" transform="rotate(337.5)" fill="#D4AF37" fill-opacity="0.1"/>
    </g>

    <!-- Outer Decorative Rings -->
    <circle cx="0" cy="0" r="160" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="172" stroke-width="1" stroke-dasharray="4,6"/>
    <circle cx="0" cy="0" r="185" stroke-width="2.5"/>

    <!-- 24 Outer Regal Rays / Crests -->
    <g stroke-width="1.2">
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(15)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(30)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(45)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(60)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(75)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(90)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(105)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(120)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(135)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(150)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(165)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(180)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(195)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(210)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(225)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(240)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(255)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(270)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(285)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(300)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(315)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(330)" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M0 -185 L0 -240 Q15 -215 0 -185" transform="rotate(345)" fill="#D4AF37" fill-opacity="0.12"/>
    </g>

    <!-- Outer Perimeter Crest Dots -->
    <circle cx="0" cy="0" r="260" stroke-width="1" stroke-dasharray="2,6"/>
    <circle cx="0" cy="0" r="275" stroke-width="1.5"/>
  </g>
</svg>

